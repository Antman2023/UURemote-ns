name: Build Switch

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish from main
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: switch-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_tag || github.sha }}

jobs:
  switch:
    name: Switch ARM64
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      release_tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    env:
      PACKAGE_SWITCH: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'push' && github.ref_type == 'tag') }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve build source and release tag
        id: source
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = $env:REQUESTED_RELEASE_TAG
          $main = $env:GITHUB_REF -ceq 'refs/heads/main'
          $push = $env:GITHUB_EVENT_NAME -eq 'push'
          if ($tag) {
            if (!$main -or $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
              throw 'A release tag can only be requested from main.'
            }
          } elseif ($push -and $env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          }

          if ($tag) {
            if ($tag -cnotmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') { throw 'Expected a vX.Y.Z tag.' }
            $target = git rev-parse --verify --quiet "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0) { throw "Tag $tag does not exist." }
            git merge-base --is-ancestor $target refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) { throw 'The release tag must point to a commit on main.' }
            if ($commit -ne $target) {
              if ($push) { throw 'The tag no longer points to the triggering commit.' }
              git checkout --detach $target
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              # Dispatch uses the current packaging rules and the tagged application source.
              git restore --source=$commit --worktree -- scripts/package.py
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $commit = $target
            }
          }

          if ($tag -or ($main -and $push)) {
            $project = Get-Content -LiteralPath CMakeLists.txt -Raw
            if ($project -notmatch '(?m)^project\(UURemote-ns VERSION ([0-9]+\.[0-9]+\.[0-9]+)[\s)]') {
              throw 'Could not read the project version from CMakeLists.txt.'
            }
            $expected = 'v' + $Matches[1]
            if ($tag -and $tag -cne $expected) { throw "Tag $tag must match the CMake version ($expected)." }
            if (!$tag) {
              $tagCommit = git rev-parse --verify --quiet "refs/tags/$expected^{commit}"
              if ($LASTEXITCODE -eq 0 -and $tagCommit -eq $commit) { $tag = $expected }
            }
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Restore signing material
        if: env.PACKAGE_SWITCH == 'true'
        shell: pwsh
        env:
          UU_SIGNING_KEY_BASE64: ${{ secrets.UU_SIGNING_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UU_SIGNING_KEY_BASE64)) {
            throw 'Configure the UU_SIGNING_KEY_BASE64 Actions secret for the Switch package.'
          }
          $key = [Convert]::FromBase64String($env:UU_SIGNING_KEY_BASE64)
          if ($key.Length -ne 24) { throw 'Expected 24 bytes of UU TV signing material.' }
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE 'romfs/signing.key'), $key)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Cache SDK archives
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .tools/cache
          key: switch-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/sdk-windows.lock.json') }}

      - name: Install pinned devkitPro SDK
        run: python scripts/bootstrap_sdk.py

      - name: Compile Switch ELF
        if: env.PACKAGE_SWITCH != 'true'
        run: ./scripts/build.ps1 -CompileOnly -Jobs 4

      - name: Build NRO and SD card package
        if: env.PACKAGE_SWITCH == 'true'
        run: ./scripts/build.ps1 -Jobs 4

      - name: Collect standalone NRO
        if: env.PACKAGE_SWITCH == 'true'
        run: Copy-Item -LiteralPath build-nx/UURemote-ns.nro -Destination dist/UURemote-ns.nro

      - name: Upload Switch packages
        if: env.PACKAGE_SWITCH == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: UURemote-ns-switch-${{ steps.source.outputs.commit }}
          path: |
            dist/UURemote-ns.nro
            dist/UURemote-ns-*-switch.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish Switch prerelease
    if: needs.switch.outputs.release_tag != ''
    needs: switch
    concurrency:
      group: switch-release-${{ needs.switch.outputs.release_tag }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Switch packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: UURemote-ns-switch-${{ needs.switch.outputs.commit }}
          path: dist

      - name: Publish GitHub Release
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.switch.outputs.release_tag }}
          RELEASE_COMMIT: ${{ needs.switch.outputs.commit }}
        run: |
          tr -d '\r' < SHA256SUMS | sha256sum --check --strict -
          target=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$target" != "$RELEASE_COMMIT" ]]; then
            echo "The remote tag no longer points to the build commit." >&2
            exit 1
          fi

          zip="UURemote-ns-${RELEASE_TAG#v}-switch.zip"
          assets=(UURemote-ns.nro "$zip" SHA256SUMS)
          title="UU Remote NS $RELEASE_TAG"
          if release=$(gh release view "$RELEASE_TAG" --json name,isDraft,isPrerelease,assets,url); then
            if jq -e '.isDraft == false' <<< "$release" >/dev/null; then
              jq -e --arg zip "$zip" '.isPrerelease and (([.assets[].name] | sort) == (["UURemote-ns.nro", $zip, "SHA256SUMS"] | sort))' <<< "$release" >/dev/null
              jq -r '.url' <<< "$release"
              exit 0
            fi
            jq -e --arg title "$title" '.isPrerelease and .name == $title' <<< "$release" >/dev/null
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --generate-notes --prerelease --title "$title"
          fi
