name: Build Switch

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: switch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  switch:
    name: Switch ARM64
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PACKAGE_SWITCH: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || (github.event_name == 'push' && github.ref_type == 'tag') }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          $project = Get-Content -LiteralPath CMakeLists.txt -Raw
          if ($project -notmatch '(?m)^project\(UURemote-ns VERSION ([0-9]+\.[0-9]+\.[0-9]+)[\s)]') {
            throw 'Could not read the project version from CMakeLists.txt.'
          }
          $expected = 'v' + $Matches[1]
          if ($env:GITHUB_REF_NAME -cne $expected) {
            throw "Tag $env:GITHUB_REF_NAME must match the CMake version ($expected)."
          }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release tag must point to a commit on main.' }

      - name: Restore signing material
        if: env.PACKAGE_SWITCH == 'true'
        shell: pwsh
        env:
          UU_SIGNING_KEY_BASE64: ${{ secrets.UU_SIGNING_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UU_SIGNING_KEY_BASE64)) {
            throw 'Configure the UU_SIGNING_KEY_BASE64 Actions secret for the Switch package.'
          }
          $key = [Convert]::FromBase64String($env:UU_SIGNING_KEY_BASE64)
          if ($key.Length -ne 24) { throw 'Expected 24 bytes of UU TV signing material.' }
          [IO.File]::WriteAllBytes((Join-Path $env:GITHUB_WORKSPACE 'romfs/signing.key'), $key)

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Cache SDK archives
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: .tools/cache
          key: switch-sdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/sdk-windows.lock.json') }}

      - name: Install pinned devkitPro SDK
        run: python scripts/bootstrap_sdk.py

      - name: Compile Switch ELF
        if: env.PACKAGE_SWITCH != 'true'
        run: ./scripts/build.ps1 -CompileOnly -Jobs 4

      - name: Build NRO and SD card package
        if: env.PACKAGE_SWITCH == 'true'
        run: ./scripts/build.ps1 -Jobs 4

      - name: Collect standalone NRO
        if: env.PACKAGE_SWITCH == 'true'
        run: Copy-Item -LiteralPath build-nx/UURemote-ns.nro -Destination dist/UURemote-ns.nro

      - name: Upload Switch packages
        if: env.PACKAGE_SWITCH == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: UURemote-ns-switch-${{ github.sha }}
          path: |
            dist/UURemote-ns.nro
            dist/UURemote-ns-*-switch.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish Switch prerelease
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: switch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Switch packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: UURemote-ns-switch-${{ github.sha }}
          path: dist

      - name: Publish GitHub Release
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tr -d '\r' < SHA256SUMS | sha256sum --check --strict -
          gh release create "$GITHUB_REF_NAME" \
            UURemote-ns.nro "UURemote-ns-${GITHUB_REF_NAME#v}-switch.zip" SHA256SUMS \
            --verify-tag --generate-notes --prerelease --title "UU Remote NS $GITHUB_REF_NAME"
